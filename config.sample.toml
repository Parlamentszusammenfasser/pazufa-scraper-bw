[main]
# linearize = false
collector-uuid = "00000000-0000-0000-0000-000000000001"
# cycle-time-s = 10800
max-concurrency = 5

[cache]
# redis-host = "localhost"
# redis-port = 6379
# Managed Redis (TLS + auth) — takes precedence over host/port. Env: REDIS_URL.
# redis-url = "rediss://default:<token>@<endpoint>:6379"

[backend]
# ltzf-api-url = "http://localhost:80"
ltzf-api-key = "SET_VIA_ENV"

[scrapers]
scraper-dir = "./src/bawue"
# scrapers = []

[logging]
# Dumps one JSONL line per built API object. Off unless set — on a full run it
# reaches a few hundred MB, which a container filesystem cannot absorb.
## api-obj-log = "locallogs"

[llm]
# provider-key is read from the LLM_PROVIDER_KEY env var (keep secrets out of the file).
# provider-key = "SET_VIA_ENV"
model = "gpt-5-nano"
# Model alternatives (cost per doc: full document input + ~300 output tokens):
#   gpt-5-nano     $0.05/$0.40   ~$0.0007/doc  (default, cheapest)
#   gpt-4.1-nano   $0.10/$0.40   ~$0.0013/doc  (1M context window)
#   gpt-4o-mini    $0.15/$0.60   ~$0.0020/doc  (proven, older)
#   gpt-5.4-nano   $0.20/$1.25   ~$0.0028/doc  (newest nano, best quality/cost)
#   gpt-4.1-mini   $0.40/$1.60   ~$0.0053/doc  (better reasoning)
#   gpt-5.4-mini   $0.75/$4.50   ~$0.0104/doc  (best quality in budget tier)

# BaWue-specific configuration
# The four keys below are the ones that differ per deployment, so each has an env
# override (in brackets) — a cloud deployment ships this file unchanged and sets
# those instead of baking its own TOML into the image.
[bawue]
parlis-request-delay-s = 1.0            # env: PARLIS_REQUEST_DELAY_S
# WP 17: Landtag constituted - 2021-04-26
# WP 18: Landtag constituted - 2026-05-01
wahlperiode = 17                        # env: WAHLPERIODE
wahlperiode-start-date = "2021-04-26"   # env: WAHLPERIODE_START_DATE
# Only scrape Vorgangstypen supported by the backend. Others map to SONSTIG and are rejected.
# Available values: "Gesetzgebung", "Haushaltsgesetzgebung", "Volksantrag", "Antrag",
#   "Kleine Anfrage", "Große Anfrage", "Anfrage", "Entschließungsantrag", "Dringlicher Antrag",
#   "Dringliche Anfrage", "Änderungsantrag", "Unterrichtung", "Bericht", "Wahlvorschlag",
#   "Sonstiges"
enabled-vorgangstypen = ["Gesetzgebung", "Haushaltsgesetzgebung", "Volksantrag"]
# Filter out stations with type "sonstig" (unmapped Fundstellen like "Mitteilung").
# The backend currently panics on sonstig stations (validate.rs:310).
# Set to false once the backend accepts sonstig.
#filter-sonstig-stations = true
# Expose the Initiativdrucksache as a cross-reference `vg_ident` (Issue #26).
# Off by default as a backend workaround (DD-041): the backend merges unrelated
# Vorgänge that share this many-to-one ident → HTTP 500 rel_station_dokument_pkey.
# Set to true once the backend matches only on 1:1 identifiers.
#emit-initdrucks-ident = false

ics-url = "https://www.landtag-bw.de/resource/calendar/501552/download/terminkalender.ics"

# Beteiligungsportal-specific configuration
[beteiligung]
# wahlperiode = 17                      # env: BETEILIGUNG_WAHLPERIODE
# request-delay-s = 2.0

# Gesetzblatt Baden-Württemberg-specific configuration
# Source: https://www.baden-wuerttemberg.de/de/service/gesetze-und-verordnungen/gesetzblatt
# The site is digital only since 2024 (start-year default); earlier years are paper.
# Gesetzblatt: resolves a PARLIS Gesetzblatt citation to its real Ausgabedatum
# for the postparl-gsblt station (DD-047). Not a Vorgangs-source of its own.
[gesetzblatt]
# request-delay-s = 1.0

[notifications]
# mattermost-hook is read from the MATTERMOST_HOOK env var (keep secrets out of
# the file — this one is published to Docker Hub inside the image).
# mattermost-hook = "SET_VIA_ENV"
mattermost-username = "bawue-scraper"

[main]
# linearize = false
collector-uuid = "00000000-0000-0000-0000-000000000001"
# cycle-time-s = 10800

[cache]
# redis-host = "localhost"
# redis-port = 6379

[backend]
# ltzf-api-url = "http://localhost:80"
ltzf-api-key = "SET_VIA_ENV"

[scrapers]
scraper-dir = "./src/bawue"
# scrapers = []

[logging]
## api-obj-log = "locallogs"

[llm]
openai-api-key = "SET_VIA_ENV"
# truncate-tokens = 12000         # max input tokens for LLM; 0 = no truncation

# BaWue-specific configuration
[bawue]
wahlperiode = 17
parlis-request-delay-s = 1.0
wahlperiode-start-date = "2021-04-26"  # WP 17: Landtag constituted
# Only scrape Vorgangstypen supported by the backend. Others map to SONSTIG and are rejected.
# Available values: "Gesetzgebung", "Haushaltsgesetzgebung", "Volksantrag", "Antrag",
#   "Kleine Anfrage", "Große Anfrage", "Anfrage", "Entschließungsantrag", "Dringlicher Antrag",
#   "Dringliche Anfrage", "Änderungsantrag", "Unterrichtung", "Bericht", "Wahlvorschlag",
#   "Sonstiges"
enabled-vorgangstypen = ["Gesetzgebung", "Haushaltsgesetzgebung", "Volksantrag"]
ics-url = "https://www.landtag-bw.de/resource/calendar/501552/download/terminkalender.ics"

# Beteiligungsportal-specific configuration
[beteiligung]
# wahlperiode = 17
# request-delay-s = 2.0

name: Deploy staging

# Deploys a released scraper image to the Cloud Run Job `bawue-scraper-staging`
# and keeps its Cloud Scheduler trigger in sync. Manual on purpose — staging is
# deployed when you want to test a specific tag, not on every push.
#
# One-time setup lives in deploy/gcp/bootstrap.sh (APIs, Artifact Registry,
# service accounts, Workload Identity Federation, empty Secret Manager entries).
#
# Repository variables: GCP_PROJECT_ID, GCP_REGION, WIF_PROVIDER, WIF_SERVICE_ACCOUNT
# Environment "staging" — variables: COLLECTOR_ID, LTZF_API_URL
#                         secrets:   LTZF_API_KEY, LLM_PROVIDER_KEY, REDIS_URL

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Hub tag of the scraper image to deploy'
        required: true
        default: latest

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write  # mint the OIDC token WIF exchanges for GCP credentials

    env:
      JOB_NAME: bawue-scraper-staging
      SECRET_PREFIX: bawue-staging
      REGION: ${{ vars.GCP_REGION }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Resolve image name
        id: img
        run: |
          echo "image=${REGION}-docker.pkg.dev/${PROJECT_ID}/pazufa/bawue-scraper:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      # Cloud Run cannot pull from Docker Hub, so the released image is rebuilt
      # with the staging config baked in (see deploy/gcp/Dockerfile) and pushed to
      # Artifact Registry. amd64 only — that is what Cloud Run runs.
      - name: Build config-baked image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build \
            --file deploy/gcp/Dockerfile \
            --build-arg BASE_IMAGE="${{ secrets.DOCKER_REPO }}:${{ inputs.image_tag }}" \
            --build-arg CONFIG_FILE=config.staging.toml \
            --tag "${{ steps.img.outputs.image }}" \
            .
          docker push "${{ steps.img.outputs.image }}"

      # GitHub is the source of truth for secret values; Secret Manager is where
      # the job reads them from. Adding an identical version is cheap and keeps
      # this step idempotent.
      - name: Sync secrets to Secret Manager
        env:
          LTZF_API_KEY: ${{ secrets.LTZF_API_KEY }}
          LLM_PROVIDER_KEY: ${{ secrets.LLM_PROVIDER_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          sync() {  # sync <secret-suffix> <value>
            if [ -z "$2" ]; then echo "::error::Missing secret for $1"; exit 1; fi
            printf '%s' "$2" | gcloud secrets versions add "${SECRET_PREFIX}-$1" --data-file=-
          }
          sync ltzf-api-key    "$LTZF_API_KEY"
          sync llm-provider-key "$LLM_PROVIDER_KEY"
          sync redis-url       "$REDIS_URL"

      # `jobs deploy` creates or updates, so no branch on first run.
      # 4Gi: the scraper caps itself at 2 GB with MAX_CONCURRENCY=3, and
      # Tesseract/poppler are memory-hungry.
      - name: Deploy Cloud Run Job
        run: |
          gcloud run jobs deploy "$JOB_NAME" \
            --image "${{ steps.img.outputs.image }}" \
            --region "$REGION" \
            --cpu 2 \
            --memory 4Gi \
            --task-timeout 3600s \
            --max-retries 1 \
            --service-account "bawue-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-env-vars "PYTHONUNBUFFERED=1,MAX_CONCURRENCY=3,COLLECTOR_ID=${{ vars.COLLECTOR_ID }},LTZF_API_URL=${{ vars.LTZF_API_URL }}" \
            --set-secrets "LTZF_API_KEY=${SECRET_PREFIX}-ltzf-api-key:latest,LLM_PROVIDER_KEY=${SECRET_PREFIX}-llm-provider-key:latest,REDIS_URL=${SECRET_PREFIX}-redis-url:latest"

      # Twice daily, matching the cadence the hosting decision assumed.
      - name: Ensure Cloud Scheduler trigger
        run: |
          URI="https://${REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT_ID}/jobs/${JOB_NAME}:run"
          if gcloud scheduler jobs describe "$JOB_NAME" --location "$REGION" >/dev/null 2>&1; then
            VERB=update
          else
            VERB=create
          fi
          gcloud scheduler jobs "$VERB" http "$JOB_NAME" \
            --location "$REGION" \
            --schedule "0 3,15 * * *" \
            --time-zone "Europe/Berlin" \
            --uri "$URI" \
            --http-method POST \
            --oauth-service-account-email "bawue-scheduler@${PROJECT_ID}.iam.gserviceaccount.com"

      - name: Summary
        run: |
          {
            echo "### Deployed \`$JOB_NAME\`"
            echo ""
            echo "- image: \`${{ steps.img.outputs.image }}\`"
            echo "- schedule: \`0 3,15 * * *\` Europe/Berlin"
            echo ""
            echo "Run now: \`gcloud run jobs execute $JOB_NAME --region $REGION\`"
          } >> "$GITHUB_STEP_SUMMARY"

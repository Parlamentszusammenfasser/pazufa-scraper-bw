version: 2
updates:
  # Keeps the SHA-pinned actions and their version comments current (issue #184).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci  # conventional commit, read by semantic-release

  # poetry.lock; the Codeberg git deps (corelib, metrics client) stay manual.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]  # majors come as their own PRs
    commit-message:
      prefix: chore  # "chore(deps):" cuts no release; ships with the next fix/feat
      include: scope

  # Base image in the Dockerfile. Minor/major are ignored: requires-python is <3.15 and the
  # site-packages path in the Dockerfile names 3.14, so a new minor is a deliberate change.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
    commit-message:
      prefix: chore

  # Dev/prod compose images. Our own image is bumped by ci.yml's update-compose, not here.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: schneefisch/pazufa-bawue-scraper  # Dependabot drops the docker.io/ prefix
    commit-message:
      prefix: chore

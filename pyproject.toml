[project]
name = "pazufa-bawue-scraper"
version = "0.1.0b1"
description = "Baden-Württemberg PARLIS scraper for the PaZuFa collector framework"
authors = [{name = "schneefisch"}]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "bawue", from = "src"}]

[tool.poetry.dependencies]
collector = {path = "../pazufa-collector", develop = true}
pazufa-corelib = {path = "../pazufa-scraper-core", develop = true}
openapi-client = {path = "../pazufa-collector/oapicode", develop = true}
lxml = ">=6.0"
requests = "^2.32"
toml = ">=0.10"
icalendar = ">=7.0"
certifi = ">=2026.0"
python-json-logger = "^3.2"
litellm = ">=1.83.0"
json-repair = "^0.59"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = "^7.0"
pytest-mock = "^3.15"
pytest-asyncio = "^1.3"
responses = "^0.26"
pytest-httpserver = "^1.1"
ruff = "^0.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring a running PaZuFa backend",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

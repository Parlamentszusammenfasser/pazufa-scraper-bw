[project]
name = "pazufa-bawue-scraper"
version = "0.1.0b1"
description = "Baden-Württemberg PARLIS scraper for the PaZuFa platform"
authors = [{name = "schneefisch"}]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "bawue", from = "src"}]

[tool.poetry.dependencies]
# Pinned to a git tag (not a path install) so a broken upstream push cannot
# break this image build — see migration doc §6 D5 / success criterion C6.
# For local iteration against a sibling checkout, uncomment the dev-group
# override below.
pazufa-corelib = {git = "https://codeberg.org/PaZuFa/pazufa-scraper-core.git", rev = "v0.1.2"}
httpx = ">=0.28"          # via corelib transitively; pinned explicitly (used by bawue.api)
redis = ">=7.4"           # was transitively provided by collector; used by bawue.cache
python-dotenv = ">=1.0"   # was transitively provided by collector; used by bawue.__main__
kreuzberg = ">=4.7"       # was transitively provided by collector; used by bawue_dok
lxml = ">=6.0"
requests = "^2.32"
toml = ">=0.10"
icalendar = ">=7.0"
certifi = ">=2026.0"
python-json-logger = "^3.2"
litellm = ">=1.83.0"
json-repair = "^0.61"

[tool.poetry.group.dev.dependencies]
# For local iteration, install corelib from a sibling checkout instead of the
# pinned git tag by uncommenting the next line (path installs are dev-only):
# pazufa-corelib = {path = "../pazufa-scraper-core", develop = true}
pytest = "^9.0"
pytest-cov = "^7.0"
pytest-mock = "^3.15"
pytest-asyncio = "^1.3"
responses = "^0.26"
pytest-httpserver = "^1.1"
ruff = "^0.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.semantic_release]
# Compute the next version from Conventional Commits on main and create a bare
# semver tag (0.2.2), matching the existing 0.2.0 / 0.2.1 tags, plus a Codeberg
# Release carrying the generated notes for that tag (see [.remote] below). main
# is a protected branch, so CI pushes only the tag — the `version` field below
# is not committed by CI (see .woodpecker.yml). The current version is derived
# from the latest matching git tag, not from this file, so a stale field here
# is harmless. version_toml is kept so PSR knows where the version lives.
version_toml = ["pyproject.toml:project.version"]
tag_format = "{version}"
allow_zero_version = true   # stay in 0.x; fix→patch, feat→minor (PSR 10 defaults this to false)
build_command = ""          # the Docker pipeline builds artifacts, not PSR

# Codeberg runs Forgejo, whose Releases API is Gitea-compatible, so PSR drives
# it through its "gitea" client (there is no separate forgejo/codeberg client).
# This lets PSR attach the generated release notes to each tag via the API — no
# CHANGELOG.md committed to protected main. The token env name is our choice
# (the client would default to GITEA_TOKEN); we use CODEBERG_TOKEN for clarity,
# wired to the codeberg_token secret in .woodpecker.yml. owner/repo come from
# the git remote.
[tool.semantic_release.remote]
type = "gitea"                          # Forgejo/Codeberg speak the Gitea API
domain = "codeberg.org"
token = { env = "CODEBERG_TOKEN" }

[tool.semantic_release.branches.main]
match = "main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring a running PaZuFa backend",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

variables:
  - &python_image python:3.13

when:
  - event: [push, pull_request, tag]

# Supply-chain hardening: pin external dependencies to reviewed refs.
#   pazufa-scraper-core: pinned in pyproject.toml as a git tag (rev = "v0.1.2");
#                        poetry fetches it during `poetry install`.
#   plugin-docker-buildx: 6 (update when upgrading)
#
# Platforms: linux/amd64 (Mac/CI) + linux/arm64 (Pi 3B on 64-bit Pi OS).
# arm/v7 (32-bit) is excluded: the dependency stack (tiktoken, tokenizers,
# cryptography, pillow) has no arm/v7 wheels and takes hours to compile under
# QEMU. The Pi 3B supports 64-bit; use Raspberry Pi OS 64-bit (default since 2023).
#
# Secrets (set in Codeberg repo → Settings → Secrets):
#   docker_username  – your Docker Hub username
#   docker_password  – Docker Hub access token (not account password)
#   docker_repo      – full image path, e.g. johndoe/pazufa-bawue-scraper
#   codeberg_token   – Codeberg access token with repo read+write, used by
#                      semantic-release to push the version bump + git tag
#
# Release workflow (trunk-based, automated semantic versioning):
#   Merge to main → semantic-release reads Conventional Commits since the last
#   tag, computes the next version (feat→minor, fix→patch), pushes a bare semver
#   tag (e.g. 0.2.2) on the main commit, and publishes a Codeberg Release with
#   the generated notes. main is a protected branch, so no version-bump commit
#   is pushed to it — only the tag.
#   → that tag push triggers docker-release, which pushes :0.2.2 :0.2 :latest
#   Main branch pushes also produce snapshot tags → :main :main-<sha8>
#   Feature branch pushes → :dev-<sha8>

steps:
  # Scan poetry.lock for known CVEs before any package installation.
  # Ignore entries are maintained in .trivyignore at the repo root.
  - name: dependency-audit
    image: aquasec/trivy:0.70.0
    commands:
      - trivy fs --scanners vuln --exit-code 1 poetry.lock

  - name: ruff-lint
    image: *python_image
    depends_on: [dependency-audit]
    commands:
      - pip install --quiet ruff
      - ruff check src/ tests/

  - name: ruff-format
    image: *python_image
    depends_on: [dependency-audit]
    commands:
      - pip install --quiet ruff
      - ruff format --check src/ tests/

  - name: pytest
    image: *python_image
    depends_on: [dependency-audit]
    environment:
      DEBIAN_FRONTEND: noninteractive
      PIP_ROOT_USER_ACTION: ignore
    commands:
      - pip install --quiet poetry
      # poetry.toml enforces no-scripts; install won't modify the lockfile.
      # pazufa-corelib is fetched from its pinned git tag (see pyproject.toml).
      - poetry install --no-interaction --no-ansi
      - poetry run pytest -m 'not integration'

  # Automated semantic versioning: on a merge to main, compute the next version
  # from Conventional Commits, tag the current main commit with a bare semver
  # tag, and publish a Codeberg Release carrying the generated notes for that
  # tag. main is a protected branch, so PSR must not push a version-bump commit
  # or changelog to it — with --no-commit it pushes only the tag (PSR pushes the
  # branch ref only when it also commits). The tag push then triggers the
  # docker-release step below (separate run). docker-release does not run
  # semantic-release, so there is no release loop.
  - name: semantic-release
    image: *python_image
    depends_on: [pytest, ruff-lint, ruff-format]
    environment:
      # PSR drives Codeberg through its gitea client (Forgejo is Gitea-API-
      # compatible); the token env name is configured as CODEBERG_TOKEN in
      # pyproject.toml. It authenticates both the tag push and the Releases API
      # call. See [tool.semantic_release.remote] in pyproject.toml.
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      # PSR needs full history + tags to find the last release and parse commits.
      - git fetch --tags --unshallow || git fetch --tags
      - git checkout main
      - git config user.name "Woodpecker CI"
      - git config user.email "ci@pazufa.local"
      - git remote set-url origin "https://$CODEBERG_TOKEN@codeberg.org/${CI_REPO}.git"
      - pip install --quiet "python-semantic-release==10.5.3"
      # --no-commit: no version-bump commit, and (since PSR only pushes the
      #   branch when it commits) no push to protected main.
      # --no-changelog: don't write/commit CHANGELOG.md; the release notes are
      #   still generated and attached to the Codeberg Release by --vcs-release.
      # --push publishes the new tag; --vcs-release creates the Codeberg Release.
      - semantic-release version --no-commit --no-changelog --tag --push --vcs-release
    when:
      - event: push
        branch: main

  # --- Docker publish steps (one per event class) ---
  # The Dockerfile fetches pazufa-corelib from its pinned git tag during the
  # image build, so no vendored sources need to be staged beforehand.

  # Semver release: git tag 0.2.2 → Docker tags 0.2.2, 0.2, latest
  - name: docker-release
    image: woodpeckerci/plugin-docker-buildx:6
    depends_on: [pytest, ruff-lint, ruff-format]
    settings:
      platforms: linux/amd64,linux/arm64
      repo:
        from_secret: docker_repo
      auto_tag: true
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      - event: tag
        ref: refs/tags/[0-9]*

  # Main branch snapshot → Docker tags main, main-<sha8>
  - name: docker-main
    image: woodpeckerci/plugin-docker-buildx:6
    depends_on: [pytest, ruff-lint, ruff-format]
    settings:
      platforms: linux/amd64,linux/arm64
      repo:
        from_secret: docker_repo
      tags:
        - main
        - main-${CI_COMMIT_SHA:0:8}
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      - event: push
        branch: main

  # Feature branch snapshot → Docker tag dev-<sha8>
  - name: docker-feature
    image: woodpeckerci/plugin-docker-buildx:6
    depends_on: [pytest, ruff-lint, ruff-format]
    settings:
      platforms: linux/amd64,linux/arm64
      repo:
        from_secret: docker_repo
      tags:
        - dev-${CI_COMMIT_SHA:0:8}
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      - event: push
        branch:
          exclude: main

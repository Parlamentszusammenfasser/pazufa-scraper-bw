version = "0.0.1"

stations = {
    R = "preparl-regent",
    E = "preparl-eckpup",
    S = "preparl-regbsl",
    I = "parl-initiativ",
    V = "parl-vollvlsgn",
    J = "parl-akzeptanz",
    Z = "parl-zurueckgz",
    N = "parl-ablehnung",
    A = "parl-ausschber",
    G = "postparl-gsblt",
    K = "postparl-kraft",

    B = "preparl-vbegde",
    W = "parl-ggentwurf",
    Y = "postparl-vesja",
    X = "postparl-vesne"
}

[tracks]
BT = {
#    gg-einspruch = "((E*R+)?S)?I((VA*(Z|VJ(<Vermittlungsausschuss>V(JGK|N))GK|VN|VA*(Z|VJGK|VN)))|Z)"
#   mit "H" als Vermittlungsausschuss, "F" als Formulierungshilfe für Plenarinitiativen
    gg-einspruch  = "((E*R+)?SF?)?I((VA*(Z|VN|VA*(Z|VJ((GK|N)|(HV(JGK|N)))|VN)))|Z)",
    gg-zustimmung = "((E*R+)?SF?)?I((VA*(Z|VN|VA*(Z|VJ((GK|N)|(HV(JGK|N)))|VN)))|Z)",
    ## TODO: wir brauchen wahrscheinlich einen "Antrag stellen" Stationstyp
    ## TODO 2: wir brauchen einen Vermittlungsausschuss-Typ
    bw-einsatz = "SVA*VA*V(J|N)" # VV weil 2. Lesung immer 2. und 3. gleichzeitig ist
}

BR = {
    # "IVA*<Bundestagszeug>V(J|N<Vermittlungsausschuss>V[JN])"
    # gg-einspruch  = "IVA*<Bundestagszeug>V(J|N<Vermittlungsausschuss>V[JN])",
    gg-einspruch  = "I((VA*(Z|VJGK|VN|VA*(Z|VJGK|VN)))|Z)",
    gg-zustimmung = "I((VA*(Z|VJGK|VN|VA*(Z|VJGK|VN)))|Z)"
}


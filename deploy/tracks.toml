# BW: back-port of the trailing-A allowance from spec v0.2.4+v0.0.3 (PR #39).
# Permits trailing parl-ausschber stations after postparl-gsblt and postparl-kraft
# (Evaluations-/Folgeberichte to enacted laws). VJGK -> VJGA*KA*.
BW = {
    gg-land-parl = "((E*R+)?S)?I((VA*(Z|VJGA*KA*|VN|VA*(Z|VJGA*KA*|VN)))|Z)",
}

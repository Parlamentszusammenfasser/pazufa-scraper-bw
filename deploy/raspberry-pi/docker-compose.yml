services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  scraper:
    image: ${DOCKER_IMAGE:?Set DOCKER_IMAGE in .env, e.g. johndoe/pazufa-bawue-scraper:latest}
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    profiles:
      - run

volumes:
  redis-data:

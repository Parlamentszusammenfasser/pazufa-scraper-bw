services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data

  scraper:
    build: .
    # Override entrypoint to drop --once so the framework loops via cycle-time-s
    entrypoint: ["python", "-m", "collector", "--config-file", "config.toml"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CYCLE_TIME_S: 300          # re-run every 5 minutes
      #LTZF_API_URL: ${LTZF_API_URL:?Set LTZF_API_URL in .env}
      #LTZF_API_KEY: ${LTZF_API_KEY:?Set LTZF_API_KEY in .env}
      #LLM_PROVIDER_KEY: ${LLM_PROVIDER_KEY:-}
    volumes:
      # Mount staging config over the baked-in config.toml
      - ./config.staging.toml:/app/config.toml:ro
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:

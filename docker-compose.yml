services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data

  scraper:
    # References the image build from `make package`
    # to re-create the image with the latest code run `make clean package`
    image: docker.io/schneefisch/pazufa-bawue-scraper:1.3.0
    # Override entrypoint to tee output into locallogs; --once runs a single cycle and exits.
    # bash pipefail keeps python's exit code (e.g. 137 on OOM kill) instead of tee's.
    entrypoint: ["bash", "-o", "pipefail", "-c", "python -m bawue --config-file config.toml --once 2>&1 | tee /app/locallogs/stdout.log"]
    environment:
      # Set REDIS_URL in .env to use a managed Redis (e.g. Upstash, rediss://...);
      # unset falls back to the local redis service.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MAX_CONCURRENCY: 3         # limit parallel extractions to prevent OOM
      PYTHONUNBUFFERED: "1"
      LTZF_API_URL: ${LTZF_API_URL:?Set LTZF_API_URL in .env}
      LTZF_API_KEY: ${LTZF_API_KEY:?Set LTZF_API_KEY in .env}
      LLM_PROVIDER_KEY: ${LLM_PROVIDER_KEY:?SET LLM_PROVIDER_KEY in .env}
    deploy:
      resources:
        limits:
          memory: 4g
    volumes:
      # Mount staging config over the baked-in config.toml
      - ./config.staging.toml:/app/config.toml:ro
      # Persist locallogs (JSONL scraper output + stdout.log) to host
      - ./locallogs:/app/locallogs
    depends_on:
      - redis
    restart: "no"

volumes:
  redis-data:

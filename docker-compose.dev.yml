# Local development stack: PostgreSQL + Redis + pazufa-backend
#
# Usage: see README.md → "Running against Local Backend"
#
# Prerequisites: ../pazufa-backend must be cloned alongside this repo
#   git clone https://codeberg.org/PaZuFa/pazufa-backend.git ../pazufa-backend
#
# NOTE: First build compiles the Rust backend and generates OpenAPI code
# (downloads spec from Codeberg). This takes several minutes.

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ltzf-user
      POSTGRES_PASSWORD: ltzf-pass
      POSTGRES_DB: ltzf
    ports:
      - "5432:5432"
    volumes:
      - dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltzf-user -d ltzf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  pazufa-backend:
    build:
      context: ../pazufa-backend
      dockerfile: Dockerfile.deploy
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: postgres://ltzf-user:ltzf-pass@postgres:5432/ltzf
      LTZF_KEYADDER_KEY: dev-keyadder-key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ping > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12

volumes:
  dev-pgdata:

# Local development stack: PostgreSQL + Redis + pazufa-backend
#
# Usage: see README.md → "Running against Local Backend"
#
# The backend runs from the prebuilt Docker Hub image (pazufa/backend), so no
# ../pazufa-backend clone or Rust build is needed — `up -d` just pulls the image.
# Bump the image tag below to test against a newer backend release.

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ltzf-user
      POSTGRES_PASSWORD: ltzf-pass
      POSTGRES_DB: ltzf
    ports:
      - "5432:5432"
    volumes:
      - dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltzf-user -d ltzf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  pazufa-backend:
    image: pazufa/backend:0.2.12
    ports:
      - "8090:8080"
    environment:
      DATABASE_URL: postgres://ltzf-user:ltzf-pass@postgres:5432/ltzf
      PAZUFA_PORT: "8080"
      # Dev-only keyadder key (public example from the pazufa-backend docs) used
      # to mint collector API keys — see README step 3. Must pass the backend's
      # key-format sanity check.
      PAZUFA_KEYADDER_KEY: "pazufa-ABRAKADABRAHEXEN-DRACHENSCHUPPENHAARFAERBEMITTELVERORDNUNGSBLATTFASERSTRUKTURWASSERMINDESTAUFNAHMESTEMPELGESETZ1A6a3671b9"
      RUST_LOG: info,pazufa_backend=info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/status > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12

volumes:
  dev-pgdata:
